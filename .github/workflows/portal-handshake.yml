name: Quotation ERP portal handshake regression
on:
  push:
    paths: ['index.html', 'tests/portal-handshake.test.mjs', '.github/workflows/portal-handshake.yml']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/portal-handshake.test.mjs
